name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      FORCE_COLOR: true
      HUSKY_SKIP_INSTALL: 1
      HUSKY_SKIP_HOOKS: 1
      HUSKY: 0
    steps:
      - name: Check out
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Chainguard Libraries credentials
        uses: faros-ai/infra-tools/.github/actions/setup_chainguard_npm@dfb367bd0ec3d30df76fca2396963e8e6cbe826e
        with:
          identity: ${{ secrets.CHAINGUARD_OIDC_IDENTITY }}
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Pin to 22.22.1 due to npm self-upgrade regression in 22.22.2
          # https://github.com/nodejs/node/issues/62425
          node-version: 22.22.1
      # TODO: Remove once we upgrade to Node 24 (which bundles npm 11)
      - name: Upgrade npm
        run: npm install -g npm@11
      - name: Check lockfile resolves from Chainguard
        run: npm run check:lockfile
      - name: Build
        run: npm ci --unsafe-perm
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --coverage
      - name: Delete NPM credentials
        if: always()
        run: rm -f .npmrc "$HOME/.npmrc"
